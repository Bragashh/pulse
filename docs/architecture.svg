<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <style>
      .bg      { fill: #0f172a; }
      .lane    { fill: #1e293b; stroke: #334155; stroke-width: 1; rx: 10; }
      .box     { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 8; }
      .boxblue { fill: #16233b; stroke: #3b82f6; stroke-width: 1.5; rx: 8; }
      .edge    { fill: #0b1220; stroke: #475569; stroke-width: 1.5; rx: 8; }
      .title   { fill: #f1f5f9; font-size: 15px; font-weight: 700; }
      .label   { fill: #f1f5f9; font-size: 13px; font-weight: 600; }
      .sub     { fill: #94a3b8; font-size: 11px; }
      .lane-l  { fill: #64748b; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; }
      .accent  { fill: #60a5fa; font-size: 11px; font-weight: 600; }
      .flow    { stroke: #3b82f6; stroke-width: 2; fill: none; }
      .flowg   { stroke: #475569; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
      .arrowfill { fill: #3b82f6; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" class="arrowfill"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="720"/>

  <!-- Title -->
  <text x="40" y="44" class="title" font-size="22">⚡ Pulse — Architecture</text>
  <text x="40" y="66" class="sub" font-size="12">Provisioned with Terraform · configured + deployed with Ansible · built and tested via GitHub Actions</text>

  <!-- ===== Edge layer ===== -->
  <text x="40" y="104" class="lane-l">EDGE</text>
  <rect class="edge" x="40" y="116" width="200" height="58"/>
  <text x="60" y="142" class="label">Internet</text>
  <text x="60" y="160" class="sub">visitors · recruiters</text>

  <rect class="edge" x="300" y="116" width="240" height="58"/>
  <text x="320" y="142" class="label">Cloudflare</text>
  <text x="320" y="160" class="sub">DNS + proxy · Full (strict) TLS</text>

  <rect class="boxblue" x="600" y="116" width="360" height="58"/>
  <text x="620" y="142" class="label">nginx — frontend container</text>
  <text x="620" y="160" class="sub">TLS termination per subdomain · reverse proxy · ports 80/443</text>

  <!-- arrows edge -->
  <path class="flow" d="M240,145 L298,145" marker-end="url(#arrow)"/>
  <path class="flow" d="M540,145 L598,145" marker-end="url(#arrow)"/>

  <!-- ===== App layer ===== -->
  <text x="40" y="220" class="lane-l">APPLICATION (Docker network: pulse-net)</text>
  <rect class="lane" x="40" y="232" width="920" height="170" rx="10"/>

  <rect class="box" x="64" y="256" width="200" height="64"/>
  <text x="80" y="282" class="label">pulse-backend</text>
  <text x="80" y="300" class="sub">Flask API · /api · /demo</text>
  <text x="80" y="314" class="sub">alert webhook receiver</text>

  <rect class="box" x="288" y="256" width="200" height="64"/>
  <text x="304" y="282" class="label">url-shortener</text>
  <text x="304" y="300" class="sub">Flask · /shorten</text>
  <text x="304" y="314" class="sub">redirects + own metrics</text>

  <rect class="box" x="512" y="256" width="200" height="64"/>
  <text x="528" y="282" class="label">pulse-redis</text>
  <text x="528" y="300" class="sub">demo state · cooldowns</text>
  <text x="528" y="314" class="sub">rate limiting</text>

  <rect class="box" x="736" y="256" width="200" height="64"/>
  <text x="752" y="282" class="label">SQLite (volume)</text>
  <text x="752" y="300" class="sub">monitored services</text>
  <text x="752" y="314" class="sub">soft-delete store</text>

  <text x="64" y="356" class="sub">Both Flask services expose <tspan class="accent">/prometheus-metrics</tspan> · backend + shortener use Redis · backend persists to SQLite</text>
  <text x="64" y="378" class="sub">Containers resolve each other by name on the shared bridge network. Only nginx is exposed externally.</text>

  <!-- ===== Observability layer ===== -->
  <text x="40" y="446" class="lane-l">OBSERVABILITY</text>
  <rect class="lane" x="40" y="458" width="920" height="200" rx="10"/>

  <rect class="box" x="64" y="482" width="190" height="64"/>
  <text x="80" y="508" class="label">Prometheus</text>
  <text x="80" y="526" class="sub">scrapes metrics (15s)</text>
  <text x="80" y="540" class="sub">evaluates 6 alert rules</text>

  <rect class="box" x="278" y="482" width="190" height="64"/>
  <text x="294" y="508" class="label">Alertmanager</text>
  <text x="294" y="526" class="sub">groups + dedupes</text>
  <text x="294" y="540" class="sub">routes firing alerts</text>

  <rect class="box" x="492" y="482" width="190" height="64"/>
  <text x="508" y="508" class="label">Loki + Promtail</text>
  <text x="508" y="526" class="sub">ships container logs</text>
  <text x="508" y="540" class="sub">queryable log store</text>

  <rect class="boxblue" x="706" y="482" width="230" height="64"/>
  <text x="722" y="508" class="label">Grafana</text>
  <text x="722" y="526" class="sub">8-panel dashboard (as code)</text>
  <text x="722" y="540" class="sub">anonymous viewer enabled</text>

  <!-- observability flows -->
  <path class="flow" d="M254,514 L276,514" marker-end="url(#arrow)"/>
  <text x="120" y="592" class="sub">Prometheus + Loki are queried by Grafana. Alertmanager → backend webhook → Discord + operator console.</text>

  <rect class="edge" x="492" y="600" width="190" height="40"/>
  <text x="508" y="625" class="label">Discord</text>

  <rect class="edge" x="706" y="600" width="230" height="40"/>
  <text x="722" y="625" class="label">Operator console (admin)</text>

  <path class="flow" d="M373,546 C373,575 470,585 540,598" marker-end="url(#arrow)"/>
  <path class="flow" d="M373,546 C500,580 700,585 800,598" marker-end="url(#arrow)"/>

  <!-- scrape arrows from app down to prometheus -->
  <path class="flowg" d="M150,320 C150,420 150,440 150,480" marker-end="url(#arrow)"/>
  <path class="flowg" d="M360,320 C320,420 200,440 175,480" marker-end="url(#arrow)"/>

  <!-- footer -->
  <text x="40" y="694" class="sub">Two environments — production (*.pulse-hq.dev) and staging (*-staging.pulse-hq.dev) — each deployable with one Ansible command.</text>
</svg>
