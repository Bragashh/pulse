---
# Deploy the Pulse application (backend + frontend).
#
# Usage:
#   ansible-playbook -i inventory/production.ini playbooks/deploy-pulse.yml

- name: Deploy Pulse application
  hosts: all
  become: yes
  vars_files:
    - ../vault.yaml
  vars:
    ecr_registry: "871576119954.dkr.ecr.eu-central-1.amazonaws.com"
    aws_region: "eu-central-1"
    is_staging: "{{ 'staging' in inventory_file }}"
    primary_domain: "{{ 'staging.pulse-hq.dev' if is_staging else 'pulse-hq.dev' }}"
    grafana_hostname: "{{ 'grafana-staging.pulse-hq.dev' if is_staging else 'grafana.pulse-hq.dev' }}"
    prometheus_hostname: "{{ 'prometheus-staging.pulse-hq.dev' if is_staging else 'prometheus.pulse-hq.dev' }}"
    shortener_hostname: "{{ 's-staging.pulse-hq.dev' if is_staging else 's.pulse-hq.dev' }}"
  roles:
    - common
    - pulse
