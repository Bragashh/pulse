---
# Deploy the monitoring stack (Prometheus, Grafana, Loki, Promtail).
#
# Usage:
#   ansible-playbook -i inventory/staging.ini playbooks/deploy-monitoring.yml

- name: Deploy monitoring stack
  hosts: all
  become: yes
  vars_files:
    - ../vault.yaml
  vars:
    is_staging: "{{ 'staging' in inventory_file }}"
    grafana_hostname: "{{ 'grafana-staging.pulse-hq.dev' if is_staging else 'grafana.pulse-hq.dev' }}"
  roles:
    - common
    - monitoring
