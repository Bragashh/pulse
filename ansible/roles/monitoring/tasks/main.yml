---
# Deploy the monitoring stack on the EC2: Prometheus, Grafana, Loki, Promtail.
# Configs are copied from ../../monitoring/ (single source of truth).

- name: Ensure monitoring directories exist on host
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /opt/pulse/monitoring
    - /opt/pulse/monitoring/grafana/datasources
    - /opt/pulse/monitoring/grafana/dashboards
    - /opt/pulse/monitoring/alerts
    - /opt/pulse/monitoring-data/prometheus
    - /opt/pulse/monitoring-data/grafana
    - /opt/pulse/monitoring-data/loki

- name: Set ownership on Grafana data dir (Grafana runs as uid 472)
  file:
    path: /opt/pulse/monitoring-data/grafana
    state: directory
    owner: '472'
    group: '472'
    mode: '0755'

- name: Set ownership on Prometheus data dir (Prometheus runs as uid 65534)
  file:
    path: /opt/pulse/monitoring-data/prometheus
    state: directory
    owner: '65534'
    group: '65534'
    mode: '0755'

- name: Set ownership on Loki data dir (Loki runs as uid 10001)
  file:
    path: /opt/pulse/monitoring-data/loki
    state: directory
    owner: '10001'
    group: '10001'
    mode: '0755'

- name: Copy Prometheus config
  copy:
    src: "{{ playbook_dir }}/../../monitoring/prometheus.yml"
    dest: /opt/pulse/monitoring/prometheus.yml
    mode: '0644'
  notify: reload prometheus

- name: Copy Promtail config
  copy:
    src: "{{ playbook_dir }}/../../monitoring/promtail-config.yml"
    dest: /opt/pulse/monitoring/promtail-config.yml
    mode: '0644'

- name: Copy Grafana dashboard provider config
  copy:
    src: "{{ playbook_dir }}/../../monitoring/grafana/dashboards/dashboard-provider.yml"
    dest: /opt/pulse/monitoring/grafana/dashboards/dashboard-provider.yml
    mode: '0644'

- name: Copy Grafana dashboard JSON files
  copy:
    src: "{{ playbook_dir }}/../../monitoring/grafana/dashboards/pulse-overview.json"
    dest: /opt/pulse/monitoring/grafana/dashboards/pulse-overview.json
    mode: '0644'

- name: Copy alert rule files (if any)
  copy:
    src: "{{ playbook_dir }}/../../monitoring/alerts/"
    dest: /opt/pulse/monitoring/alerts/
    mode: '0644'
  ignore_errors: yes   # Empty folder is fine; alerts come in Step 8

# --- Containers ---

- name: Run Prometheus container
  community.docker.docker_container:
    name: pulse-prometheus
    image: prom/prometheus:latest
    state: started
    recreate: no
    networks:
      - name: pulse-net
        aliases:
          - prometheus
    volumes:
      - /opt/pulse/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /opt/pulse/monitoring/alerts:/etc/prometheus/alerts:ro
      - /opt/pulse/monitoring-data/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    restart_policy: always

- name: Run Loki container
  community.docker.docker_container:
    name: pulse-loki
    image: grafana/loki:latest
    state: started
    recreate: no
    networks:
      - name: pulse-net
        aliases:
          - loki
    volumes:
      - /opt/pulse/monitoring-data/loki:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart_policy: always

- name: Run Promtail container
  community.docker.docker_container:
    name: pulse-promtail
    image: grafana/promtail:latest
    state: started
    recreate: no
    networks:
      - name: pulse-net
    volumes:
      - /opt/pulse/monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    restart_policy: always

- name: Run Grafana container
  community.docker.docker_container:
    name: pulse-grafana
    image: grafana/grafana:latest
    state: started
    recreate: no
    networks:
      - name: pulse-net
    volumes:
      - /opt/pulse/monitoring-data/grafana:/var/lib/grafana
      - /opt/pulse/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - /opt/pulse/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    env:
      GF_SECURITY_ADMIN_USER: "{{ grafana_admin_user }}"
      GF_SECURITY_ADMIN_PASSWORD: "{{ grafana_admin_password }}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "https://{{ grafana_hostname }}"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    restart_policy: always