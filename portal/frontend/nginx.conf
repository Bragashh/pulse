# --- Grafana (production) ---
server {
    listen 443 ssl;
    server_name grafana.pulse-hq.dev;

    ssl_certificate     /etc/letsencrypt/live/grafana.pulse-hq.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.pulse-hq.dev/privkey.pem;

    location / {
        proxy_pass http://pulse-grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# --- Grafana (staging) ---
server {
    listen 443 ssl;
    server_name grafana.staging.pulse-hq.dev;

    ssl_certificate     /etc/letsencrypt/live/grafana.staging.pulse-hq.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.staging.pulse-hq.dev/privkey.pem;

    location / {
        proxy_pass http://pulse-grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# --- Prometheus (production) — basic auth protected ---
server {
    listen 443 ssl;
    server_name prometheus.pulse-hq.dev;

    ssl_certificate     /etc/letsencrypt/live/prometheus.pulse-hq.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prometheus.pulse-hq.dev/privkey.pem;

    auth_basic           "Prometheus";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://pulse-prometheus:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# --- Prometheus (staging) — basic auth protected ---
