# Redirect all HTTP to HTTPS, except /.well-known/acme-challenge/ for Let's Encrypt
server {
    listen 80;
    server_name pulse-hq.dev www.pulse-hq.dev staging.pulse-hq.dev
                grafana.pulse-hq.dev grafana.staging.pulse-hq.dev
                prometheus.pulse-hq.dev prometheus.staging.pulse-hq.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Pulse dashboard (production) ---
server {
    listen 443 ssl;
    server_name pulse-hq.dev www.pulse-hq.dev;

    ssl_certificate     /etc/letsencrypt/live/pulse-hq.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pulse-hq.dev/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://pulse-backend:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# --- Pulse dashboard (staging) ---
server {
    listen 443 ssl;
    server_name staging.pulse-hq.dev;

    ssl_certificate     /etc/letsencrypt/live/staging.pulse-hq.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.pulse-hq.dev/privkey.pem;

