global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alerts/*.yml"

scrape_configs:
  - job_name: 'pulse-backend'
    metrics_path: '/prometheus-metrics'
    static_configs:
      - targets: ['172.17.0.1:5000']
        labels:
          environment: 'local'
          service: 'pulse-backend'

  - job_name: 'url-shortener'
    metrics_path: '/prometheus-metrics'
    static_configs:
      - targets: ['url-shortener:8000']
        labels:
          environment: 'local'
          service: 'url-shortener'
