# Prometheus configuration for Pulse v1.5.1.
#
# Scrapes:
#   - The Pulse backend's /prometheus-metrics endpoint every 15 seconds.
#
# Alerting rules live in ./alerts/ and are picked up via rule_files.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alerts/*.yml"

scrape_configs:
  - job_name: 'pulse-backend'
    metrics_path: '/prometheus-metrics'
    static_configs:
      - targets: ['172.17.0.1:5000']
        labels:
          environment: 'local'
          service: 'pulse-backend'