global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert routing
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'pulse-alertmanager:9093'

# Alert rules
rule_files:
  - "/etc/prometheus/alerts/*.yml"

scrape_configs:
  - job_name: 'pulse-backend'
    metrics_path: '/prometheus-metrics'
    static_configs:
      - targets: ['pulse-backend:5000']
        labels:
          service: 'pulse-backend'

  - job_name: 'url-shortener'
    metrics_path: '/prometheus-metrics'
    static_configs:
      - targets: ['url-shortener:8000']
        labels:
          service: 'url-shortener'
